<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ergebnisse – Hebammen-Bewertung</title>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root { color-scheme:light; --bg:#faf6f2; --card:#fff; --ink:#2d2926; --muted:#6f6761; --accent:#c0654a; --line:#e6ddd5; --err:#b3261e; --star:#e8a33d; --field:#fff; --bar:#efe7e0; }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#1a1715; --card:#26211e; --ink:#f1ebe6; --muted:#b0a69e; --accent:#c9694c; --line:#433b35; --err:#ff8f87; --star:#f0b04a; --field:#14110f; --bar:#3d3631; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:680px; margin:0 auto; padding:16px 16px 64px; }
  .topbar { display:flex; justify-content:flex-end; margin-bottom:4px; }
  .theme-toggle { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 14px; font:inherit; font-size:.9rem; cursor:pointer; margin:0; }
  h1 { font-size:1.7rem; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:1.1rem; margin:0 0 10px; }
  input[type=password] { width:100%; padding:12px; font:inherit; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--ink); }
  button.go { padding:12px 18px; font:inherit; font-weight:700; color:#fff; background:var(--accent); border:0; border-radius:10px; cursor:pointer; margin-top:10px; }
  button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .err { color:var(--err); margin-top:10px; }
  .bar { height:12px; background:var(--bar); border-radius:6px; overflow:hidden; margin-top:6px; }
  .bar > span { display:block; height:100%; background:var(--star); }
  .row { margin-bottom:16px; }
  .row b { font-size:1.3rem; }
  .row small { color:var(--muted); }
  .comment { border-left:4px solid var(--line); padding:4px 0 4px 12px; margin:0 0 14px; white-space:pre-wrap; }
  .muted { color:var(--muted); }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="topbar"><button type="button" class="theme-toggle" id="themeBtn" aria-label="Zwischen hellem und dunklem Design wechseln"></button></div>
  <h1>Ergebnisse</h1>

  <div class="card" id="login">
    <label for="pw"><b>Passwort</b></label>
    <input type="password" id="pw" autocomplete="current-password">
    <button class="go" id="go">Ergebnisse anzeigen</button>
    <div class="err" id="err"></div>
  </div>

  <div id="out" class="hidden"></div>
</main>

<script>
  // ====== HIER EINTRAGEN (gleiche Werte wie in index.html) ======
  const SUPABASE_URL = 'https://blthjqjcmvuwnccpphsh.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_kaumKeyQDg73MzlirIzV6Q_0l-C84aQ';
  // ==============================================================

  const $ = (id) => document.getElementById(id);
  const LABELS = { erreichbarkeit: 'Erreichbarkeit', fachwissen: 'Fachwissen', termine: 'Terminvereinbarungen' };

  // Hell/Dunkel-Schalter
  (function () {
    const b = $('themeBtn');
    const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
    const label = () => { b.textContent = isDark() ? '☀ Hell' : '☾ Dunkel'; };
    label();
    b.addEventListener('click', () => {
      const next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
      label();
    });
  })();

  async function load() {
    $('err').textContent = '';
    $('go').disabled = true;
    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_results', {
        method: 'POST',
        headers: Object.assign(
          { 'Content-Type': 'application/json', apikey: SUPABASE_ANON_KEY },
          SUPABASE_ANON_KEY.startsWith('sb_') ? {} : { Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
        ),
        body: JSON.stringify({ p_password: $('pw').value })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const r = await res.json();

      if (r.status === 'unauthorized') { $('err').textContent = 'Falsches Passwort.'; return; }
      if (r.status === 'not_enough') {
        $('err').textContent = '';
        $('login').classList.add('hidden');
        const out = $('out'); out.classList.remove('hidden');
        out.innerHTML = '<div class="card"><p class="muted"></p></div>';
        out.querySelector('p').textContent =
          'Bisher gibt es ' + r.count + ' Bewertung(en). Zum Schutz der Anonymität werden die Ergebnisse erst ab ' + r.min + ' Bewertungen angezeigt.';
        return;
      }

      $('login').classList.add('hidden');
      const out = $('out'); out.classList.remove('hidden'); out.innerHTML = '';

      const stats = document.createElement('div'); stats.className = 'card';
      const h = document.createElement('h2'); h.textContent = 'Durchschnitt aus ' + r.count + ' Bewertungen'; stats.appendChild(h);
      Object.keys(LABELS).forEach((k) => {
        const row = document.createElement('div'); row.className = 'row';
        const v = Number(r[k]);
        row.innerHTML = '<div><b></b> <small>von 5 Sternen</small></div><div class="bar"><span></span></div>';
        row.querySelector('b').textContent = LABELS[k] + ': ' + v.toFixed(1).replace('.', ',');
        row.querySelector('span').style.width = (v / 5 * 100) + '%';
        stats.appendChild(row);
      });
      out.appendChild(stats);

      const c = document.createElement('div'); c.className = 'card';
      const ch = document.createElement('h2'); ch.textContent = 'Lob und Kritik'; c.appendChild(ch);
      if (!r.kommentare.length) {
        const p = document.createElement('p'); p.className = 'muted'; p.textContent = 'Keine Kommentare vorhanden.'; c.appendChild(p);
      } else {
        r.kommentare.forEach((t) => { const d = document.createElement('div'); d.className = 'comment'; d.textContent = t; c.appendChild(d); });
      }
      out.appendChild(c);
    } catch (e) {
      $('err').textContent = 'Die Ergebnisse konnten nicht geladen werden.';
    } finally { $('go').disabled = false; }
  }

  $('go').addEventListener('click', load);
  $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
</script>
</body>
</html>
